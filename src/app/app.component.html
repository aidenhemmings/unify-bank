<p-confirmdialog />
<p-toast [baseZIndex]="9000" />
<div class="app-container">
  <ub-loader *ngIf="loading" [loaderKey]="loaderKey"></ub-loader>
  @if (currentUser && !loading && !isAdminRoute) {
    <ub-sidebar />
  }
  <main class="main-content" [style.margin-left]="mainContentMargin">
    @if (currentUser && !loading && !isAdminRoute) {
      <ub-header-bar />
    }
    <div
      class="content-wrapper"
      [ngClass]="{ authorized: currentUser && !isAdminRoute }"
    >
      @if (!loading) {
        <router-outlet></router-outlet>
      }
    </div>
  </main>
</div>
