version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:18.19.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-{{ checksum "package-lock.json" }}
      - run:
          name: Install NPM Packages
          command: npm install
      - save_cache:
          key: v1-npm-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - run:
          name: Build Angular App
          command: npm run build -- --configuration=production

  sonarcloud-analysis:
    docker:
      - image: cimg/node:18.19.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-npm-{{ checksum "package-lock.json" }}
            - v1-backend-npm-{{ checksum "backend/package-lock.json" }}
      - run:
          name: Install Frontend NPM Packages
          command: npm install
      - run:
          name: Install Backend NPM Packages
          command: cd backend && npm install
      - save_cache:
          key: v1-npm-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - save_cache:
          key: v1-backend-npm-{{ checksum "backend/package-lock.json" }}
          paths:
            - backend/node_modules
      - run:
          name: Install SonarQube Scanner
          command: npm install --no-save sonarqube-scanner
      - run:
          name: Run SonarCloud Analysis
          command: |
            npx sonar-scanner \
              -Dsonar.projectKey=aidenhemmings_unify-bank \
              -Dsonar.organization=aidenhemmings \
              -Dsonar.sources=src,backend/src \
              -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/ssl/** \
              -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.token=$SONAR_TOKEN

workflows:
  version: 2
  build-analyze:
    jobs:
      - build
      - sonarcloud-analysis:
          requires:
            - build